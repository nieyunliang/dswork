name: Release

# 推送 v* tag 或手动触发时，构建并发布 GitHub Release
# 产物：macOS (aarch64 + x86_64) 与 Windows (NSIS)
# tauri-action 会自动生成 latest.json（更新清单）并上传，app 通过
# https://github.com/nieyunliang/dswork/releases/latest/download/latest.json 检测更新
#
# 环境策略：不再逐次安装 Rust/Node —— GitHub 官方 macOS/Windows 镜像已预装
# Node 22 与 Rust（rustup + stable）：
#   - Rust 工具链由仓库文件 src-tauri/rust-toolchain.toml 声明，rustup 自动复用镜像预装版；
#   - pnpm 版本由 package.json 的 packageManager 字段声明，pnpm/action-setup 自动读取；
#   - Node 版本由 package.json 的 engines 字段约束（镜像自带 22.x 满足要求）。
# 唯一需要补装的是 macOS 交叉编译的两个 Rust target（轻量下载）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        # 镜像自带 Node 22.x，此步骤仅在版本不匹配时做极小的增量下载；
        # 同时负责 pnpm store 缓存（cache: pnpm）
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Rust 环境：macOS/Windows 镜像已预装 rustup + stable，
      # rustup 按 src-tauri/rust-toolchain.toml 自动复用，无需安装工具链。
      # macOS 交叉编译需补装目标架构 target（每次 ~30MB 轻量下载）。
      - name: Add Rust cross-compile targets (macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        # 保持 v0：tauri-action 尚无 v1 的广泛验证，node20 运行时警告无害
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名私钥（GitHub Secrets 里配置）：
          # TAURI_SIGNING_PRIVATE_KEY           私钥文件内容（生成于 tauri signer generate -w ~/.tauri/dswork.key）
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（未设密码则留空字符串）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "dswork v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
